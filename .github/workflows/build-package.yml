name: build-package

# Step 1 (doc/spec.md, chapter 7): a one-off workflow to validate that a
# cygport build actually works on a windows-latest Actions runner. xezat
# integration and PR creation against yacp are added in later steps.
# Build dependencies, which vary per package, are specified manually via
# cygwin_packages.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory name in yacp (e.g. googletest)"
        required: true
        type: string
      version:
        description: "New version (PV) to build"
        required: true
        type: string
      cygwin_packages:
        description: "Extra Cygwin packages to install (space-separated, e.g. gcc-g++ libfoo-devel)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout dorgann
        uses: actions/checkout@v7

      - name: Checkout yacp
        uses: actions/checkout@v7
        with:
          repository: fd00/yacp
          path: yacp

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cygport util-linux sed ${{ inputs.cygwin_packages }}

      - name: Bump version
        id: bump
        run: bash -- scripts/bump_version.sh --dir "yacp/${{ inputs.package }}" --version "${{ inputs.version }}"

      - name: cygport build
        working-directory: yacp/${{ inputs.package }}
        run: |
          for step in download prep compile install package; do
            echo "::group::cygport ${{ steps.bump.outputs.cygport_file }} $step"
            bash -- cygport "${{ steps.bump.outputs.cygport_file }}" "$step"
            echo "::endgroup::"
          done

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-dist
          path: yacp/${{ inputs.package }}/**/dist/**
          if-no-files-found: error
