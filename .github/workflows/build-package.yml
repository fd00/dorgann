name: build-package

# Step 1 (doc/spec.md, chapter 7): a one-off workflow to validate that a
# cygport build actually works on a windows-latest Actions runner. PR
# creation against yacp is added in a later step.
#
# xezat handles fetching/preparing sources (`xezat prep`, before the
# build), regenerating the package's README/changelog (`xezat bump`,
# after it), and copying the build's results (cygport file, README,
# src.patch) back into the package directory (`xezat port`, after that).
# `xezat prep` copies the package directory's README into the build tree,
# which is what `xezat bump` later reads and appends a changelog entry to
# -- that copy step is why xezat prep is used here instead of a plain
# `cygport ... download`/`prep` (which would leave xezat bump editing a
# stale/absent README). `xezat bump` only ever writes back to that same
# build-tree copy, never to the package directory -- `xezat port` is what
# copies it (and the cygport file itself, and any src.patch) back out;
# without it, the package directory's tracked README would never actually
# change. Using xezat at
# all was originally deferred as an unverified Windows-Ruby risk (xezat
# depends on github-linguist, which pulls in native-extension gems:
# rugged and charlock_holmes), but now runs against a real Cygwin
# ruby/gem (installed below) rather than the windows-latest runner's
# preinstalled native Windows Ruby, which is a much more plausible
# environment for those gems to build in -- xezat itself only works
# under genuine Cygwin anyway, since it sources the real /usr/bin/cygport
# as a bash script.
#
# Compiling rugged/charlock_holmes's native extensions from scratch is
# slow (cmake-building vendored libgit2, linking ICU), so the gem
# install is cached across runs -- see scripts/xezat_cache_info.sh for
# why the cache key includes a hash of every installed Cygwin package's
# version rather than being a fixed string.
#
# Build dependencies are determined in two passes, mirroring how Cygwin's
# own official CI (cygwin/scallywag) does it: a fixed base toolchain is
# always installed first, then scripts/cygport_depends.sh asks cygport
# itself (via `cygport <file> vars ...`) what extra packages the specific
# cygport file needs. cygwin_packages remains available as a manual
# fallback for whatever the auto-detection doesn't cover.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory name in yacp (e.g. googletest)"
        required: true
        type: string
      version:
        description: "New version (PV) to build"
        required: true
        type: string
      cygwin_packages:
        description: "Extra Cygwin packages to install on top of auto-detected ones (space-separated, e.g. libfoo-devel)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      # windows-latest runners default to core.autocrlf=true, which
      # rewrites LF to CRLF on checkout and breaks bash reading any script
      # file directly ("$'\r': command not found") -- including yacp's own
      # .cygport files, which cygport itself sources as a bash script.
      # dorgann's own files are additionally covered by .gitattributes,
      # but that only applies within this repo, not the fd00/yacp checkout
      # below, so this has to be set globally before either checkout runs.
      - name: Disable line-ending conversion on checkout
        run: git config --global core.autocrlf false

      - name: Checkout dorgann
        uses: actions/checkout@v7

      - name: Checkout yacp
        uses: actions/checkout@v7
        with:
          repository: fd00/yacp
          path: yacp

      - name: Install Cygwin (base toolchain)
        uses: cygwin/cygwin-install-action@v6
        with:
          # cygport itself already depends on autoconf/automake/libtool/
          # make/binutils etc., but not on a compiler -- see doc/spec.md
          # and scripts/cygport_depends.sh for why gcc isn't detected
          # per-package. python3/ruby/rubygems aren't for building the
          # package itself either: cygport's own packaging phase
          # (pkg_info.cygpart) unconditionally probes for ruby+gem to
          # generate runtime dependency metadata, and separately scans
          # installed files for a python3 shebang to do the same -- e.g.
          # yacp/last ships C++ binaries alongside python3-shebang helper
          # scripts. Without a real Cygwin ruby/gem here, that probe was
          # instead finding the windows-latest runner's preinstalled
          # native Windows Ruby, whose RubyGems API cygport's script
          # doesn't expect (NoMethodError on Gem.default_dirs).
          packages: cygport util-linux sed gcc-core gcc-g++ python3 ruby rubygems

      # Must run after Cygwin is installed (and installed early, before
      # anything that could invoke `cygport fetch`, i.e. `xezat prep`
      # below): a bare `bash` on windows-latest resolves to Git for
      # Windows' bash until cygwin-install-action puts Cygwin's own bash
      # ahead of it on PATH, and the two have different $HOME values --
      # writing this config under the wrong one would make cygport never
      # see it.
      - name: Configure cygport
        run: bash -- scripts/configure_cygport.sh

      - name: Bump version
        id: bump
        run: bash -- scripts/bump_version.sh --dir "yacp/${{ inputs.package }}" --version "${{ inputs.version }}"

      - name: Determine extra build dependencies
        id: depends
        run: bash -- scripts/cygport_depends.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}"

      - name: Install Cygwin (extra dependencies)
        uses: cygwin/cygwin-install-action@v6
        with:
          # libicu-devel/pkg-config/zlib-devel/ruby-devel/libgit2-devel
          # are not for building the package -- they're for `gem install
          # xezat` below (xezat depends on github-linguist -> rugged,
          # which needs ruby.h from ruby-devel to compile its own Ruby C
          # extension against, and links against Cygwin's own libgit2
          # package via pkg-config (RUGGED_USE_SYSTEM_LIBRARIES=1 below)
          # rather than cmake-building its vendored copy -- that vendored
          # build hit a Cygwin/CMake-specific "CMAKE_SIZEOF_VOID_P is
          # unset" failure detecting the compiler's pointer size, and
          # Cygwin's own libgit2-devel sidesteps it entirely; and
          # charlock_holmes, which needs ICU via pkg-config as
          # libicu-devel's icu-i18n/icu-io/icu-uc .pc files).
          packages: ${{ steps.depends.outputs.extra_packages }} ${{ inputs.cygwin_packages }} libicu-devel pkg-config zlib-devel ruby-devel libgit2-devel

      - name: Compute xezat cache info
        id: xezat-cache-info
        run: bash -- scripts/xezat_cache_info.sh

      - name: Cache xezat gem install
        uses: actions/cache@v6
        with:
          path: ${{ steps.xezat-cache-info.outputs.gem_home }}
          key: xezat-gem-${{ runner.os }}-${{ steps.xezat-cache-info.outputs.version_hash }}

      - name: Install xezat
        env:
          RUGGED_USE_SYSTEM_LIBRARIES: "1"
        run: bash -c "gem install --no-document xezat"

      - name: xezat prep
        run: bash -- scripts/xezat_prep.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}"

      - name: cygport compile
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}" --step compile

      - name: cygport install
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}" --step install

      - name: cygport package
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}" --step package

      - name: Validate build via xezat
        run: bash -- scripts/xezat_validate.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}"

      - name: Update README via xezat
        run: bash -- scripts/xezat_bump.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}"

      # cygport's `install` step (above) already runs postinst as part of
      # itself (see cygport's own src_postinst.cygpart/bin/cygport.in:
      # `install` runs `src_install && __src_postinst`), which is what
      # embeds $C/README into $D as /usr/share/doc/Cygwin/$PN.README --
      # but at that point $C/README was still the pre-bump copy xezat
      # prep put there. Now that xezat bump has rewritten it, postinst
      # needs to run again on its own (cygport also exposes it as a
      # standalone step for exactly this) to re-embed the updated README
      # into $D, and package needs to run again too so the actual dist
      # archive picks up that change -- otherwise the shipped package
      # would carry the stale changelog forever.
      - name: cygport postinst
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}" --step postinst

      - name: cygport package (with updated README)
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}" --step package

      # xezat bump only rewrites the build tree's own README copy ($C),
      # never the package directory's tracked one -- see xezat_port.sh for
      # why. `xezat port` is what copies it (plus the cygport file itself
      # and any src.patch) back.
      - name: Copy build results back via xezat port
        run: bash -- scripts/xezat_port.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}"

      # Persisting this (via a PR against yacp) is Step 2's job -- for now
      # this just makes it easy to eyeball whether xezat bump/port did the
      # right thing. bump_version.sh renamed the old .cygport/.src.patch on
      # disk (a plain filesystem rename, not `git mv`), so their new names
      # are untracked as far as git is concerned -- plain `git diff` never
      # shows untracked files at all, only changes to files it already
      # tracks. Stage everything first so the new files show up too; this
      # also leaves the changes staged for Step 2's eventual commit/PR.
      #
      # cygport's own build tree (<PN>-<PV>-<PR>.<arch>/) lives inside the
      # package directory too, and `git add -A` walks into it -- it's not
      # meant to be committed (and Upload dist artifact still needs to
      # read it below, so it can't just be deleted here), and it contains
      # a symlink that Windows Git can't index ("Function not
      # implemented"), which aborts the whole `git add` rather than just
      # skipping that one file. Exclude it via pathspec instead. The
      # trailing "/**" (not just "/*") is required for the exclude to
      # match paths *inside* the directory, not just the directory itself.
      #
      # xezat also drops its own cache of the cygport file's extracted
      # variables right next to it, named "<cygport-basename>.<uname
      # -m>.yml" (e.g. last-1654-1bl1.x86_64.yml -- see xezat's
      # variables.rb), every time it parses the cygport file (prep/bump/
      # port all do). That's a local speedup, not something to commit.
      - name: Show diff
        run: |
          git -C yacp add -A -- ${{ inputs.package }} ":(exclude)${{ inputs.package }}/*.x86_64/**" ":(exclude)${{ inputs.package }}/*.x86_64.yml"
          git -C yacp diff --cached -- ${{ inputs.package }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-dist
          # A `**/dist/**` glob has to walk every subdirectory to find
          # matches, including .../<pn>-<pv>-<pr>.x86_64/build/ -- which
          # contains files coming out of the Cygwin build (e.g. a checked-
          # out .gitattributes) that Node's fs.stat can't read on Windows
          # ("EACCES: permission denied"), aborting the whole upload. The
          # single `*` here only matches the one known directory-name
          # pattern, so it never needs to look inside build/ at all.
          path: yacp/${{ inputs.package }}/*.x86_64/dist/**
          if-no-files-found: error
